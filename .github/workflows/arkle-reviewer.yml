name: Arkle Multi-Agent Code Reviewer

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  arkle-review:
    name: Arkle Security & UX Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workspace Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-id: 20

      - name: Install Basic Core Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm install --no-audit --no-fund
          fi

      - name: Run Arkle Multi-Agent Code Review
        run: node scripts/arkle-reviewer.js --all
        env:
          CI: true
